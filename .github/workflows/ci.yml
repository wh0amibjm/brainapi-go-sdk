name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: install gofumpt
        # Pinned (not @latest) so an upstream gofumpt release can't flip a green
        # PR red with no code change. Keep aligned with the gofumpt bundled in
        # the golangci-lint version below.
        run: go install mvdan.cc/gofumpt@v0.10.0

      - name: gofumpt -extra check
        run: |
          DIRTY=$(gofumpt -extra -l .)
          if [ -n "$DIRTY" ]; then
            echo "::error::gofumpt found unformatted files:"
            echo "$DIRTY"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: govulncheck
        # Scan the (TLS/HTTP/credential-handling) dependency tree for known CVEs.
        # Pinned for reproducible CI; reachability analysis keeps false positives low.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go test -race
        run: go test -race -count=1 -timeout 5m ./...

      - name: coverage floor (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -race -coverprofile=coverage.out ./pkg/...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "total pkg coverage: ${total}%"
          MIN=78
          awk -v t="$total" -v m="$MIN" 'BEGIN { if (t+0 < m+0) { printf "::error::coverage %.1f%% is below floor %d%%\n", t, m; exit 1 } }'

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: build all platforms
        run: |
          mkdir -p bin
          for target in \
              linux/amd64 linux/arm64 \
              darwin/amd64 darwin/arm64 \
              windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            echo "==> $os/$arch"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags='-s -w' \
                -o "bin/brainapi-$os-$arch$ext" \
                ./cmd/brainapi
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags='-s -w' \
                -o "bin/brainapi-mcp-$os-$arch$ext" \
                ./cmd/brainapi-mcp
          done
          ls -lh bin/

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: brainapi-binaries
          path: bin/
          retention-days: 7
