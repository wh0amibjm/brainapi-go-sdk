name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  # Opt in early so we move off Node 20 before GitHub flips the default
  # on 2026-06-02; lets us keep actions/checkout@v4 + actions/setup-go@v5
  # without absorbing v4->v5 / v5->v6 breaking-change risk in the same PR.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: gofumpt -extra check
        run: |
          DIRTY=$(gofumpt -extra -l .)
          if [ -n "$DIRTY" ]; then
            echo "::error::gofumpt found unformatted files:"
            echo "$DIRTY"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go test -race
        run: go test -race -count=1 -timeout 5m ./...

      - name: upload coverage (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -race -coverprofile=coverage.out ./pkg/...
          go tool cover -func=coverage.out | tail -1

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: build all platforms
        run: |
          mkdir -p bin
          for target in \
              linux/amd64 linux/arm64 \
              darwin/amd64 darwin/arm64 \
              windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            echo "==> $os/$arch"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags='-s -w' \
                -o "bin/brainapi-$os-$arch$ext" \
                ./cmd/brainapi
          done
          ls -lh bin/

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brainapi-binaries
          path: bin/
          retention-days: 7
